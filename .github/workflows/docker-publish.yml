name: Build and publish Docker images

on:
  # イメージのビルド・公開は main へのマージ時のみ。
  # イメージの中身に影響するファイルが変わったときだけ走らせる
  # (README などのドキュメント・テスト・compose・このワークフロー自体の変更では走らない)。
  # それ以外で公開し直したいときは Actions 画面から workflow_dispatch で手動実行する。
  push:
    branches: [main]
    paths:
      - "app/python-backend/**"
      - "app/react-frontend/**"
      - "!**/*.md"
      - "!**/.gitignore"
      - "!app/python-backend/tests/**"
      - "!app/python-backend/requirements-dev.txt"
  # PR ではテスト・フロントエンドのビルド確認・本番構成のチェックのみ実行する (ドキュメントだけの変更では走らない)
  pull_request:
    branches: [main, "develop/**"]
    paths:
      - "app/**"
      - "svg/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-publish.yml"
      - "!**/*.md"
  workflow_dispatch:

# 既定は読み取りのみ。イメージの push が必要なジョブだけ個別に packages: write を付与する
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/svg-converter

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/python-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  check-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 本番構成 (Cloudflare Tunnel) は単体で完結し、Access を迂回できるホストのポートを一切公開しないこと
      - name: Deploy config is standalone and publishes no host ports
        env:
          CLOUDFLARE_TUNNEL_TOKEN: dummy
        run: |
          docker compose -f docker-compose.deploy.yml config --format json > deploy.json
          jq -r '.services | to_entries[] | "\(.key): ports=\(.value.ports // [] | tostring)"' deploy.json
          jq -e '[.services[] | select((.ports // []) | length > 0)] | length == 0' deploy.json
          jq -e '.services | has("react-frontend") and has("python-backend") and has("cloudflared")' deploy.json
          # 研究室 PC 向け構成と別ファイルのため、バックエンドのハードニングが抜けていないことも確認する
          jq -e '.services["python-backend"] | .read_only == true and (.mem_limit != null)' deploy.json

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/react-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/react-frontend/package-lock.json
      - run: npm ci
      # tsc -b による型チェックを含む
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  build:
    needs: [test-backend, build-frontend, check-compose]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: app/python-backend
          - name: frontend
            context: app/react-frontend
    steps:
      - uses: actions/checkout@v4

      # Raspberry Pi 5 (arm64) 向けイメージもビルドする
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
