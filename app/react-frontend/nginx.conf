# Cloudflare Tunnel 経由のアクセスは実クライアントIPを CF-Connecting-IP で受け取る
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# 変換APIは重いので、インターネット公開時の連打・乱用を制限する
limit_req_zone $client_ip zone=api:1m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # リダイレクト先を相対パスにする (ポート 4174 や Tunnel のホスト名を保つ)
    absolute_redirect off;
    include /etc/nginx/conf.d/security-headers.inc;

    # バックエンドの MAX_UPLOAD_MB (既定 20MB) と揃える
    client_max_body_size 20m;

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://python-backend:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # バックエンドのログはこの 2 つだけを信頼する (クライアントが送った値は上書きされる)
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Request-ID $request_id;
        # Raspberry Pi では大きなSVGの変換・描画に時間がかかる
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ @root;
    }

    # 画面は / のみ。存在しないパス (旧 /download など) はトップへ戻す
    location @root {
        return 302 /;
    }

    location = /index.html {
        # 更新がすぐ反映されるよう HTML はキャッシュさせない (JS/CSS はハッシュ付きファイル名)
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.inc;
    }
}
