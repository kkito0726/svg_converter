# ghcr.io に公開済みのイメージで起動する (ビルド不要)
#   docker compose pull && docker compose up -d
# 特定のバージョンを使う場合: IMAGE_TAG=sha-xxxxxxx docker compose up -d
services:
  react-frontend:
    image: ghcr.io/kkito0726/svg-converter-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "4174:80"
    depends_on:
      - python-backend
    mem_limit: 128m

  # 外部には公開せず、react-frontend (nginx) の /api 経由でのみアクセスする
  # 変換結果は保存しないためボリュームは不要 (ステートレス)
  python-backend:
    image: ghcr.io/kkito0726/svg-converter-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      - MAX_UPLOAD_MB=20
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    # ログはコンテナの作り直しで消える。容量の上限だけ設ける (docs/logging-design.md 11 章)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
